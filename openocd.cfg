# OpenOCD configuration for Portenta H7 (STM32H747XIHx) + ST-Link V3 Mini
# Uses DAP direct SWD mode — required for STM32H7 dual-core target.
# HLA mode (interface/stlink.cfg) fails to recognize the H747 CPUID.

source [find interface/stlink-dap.cfg]

transport select dapdirect_swd

set CHIPNAME      STM32H747XIHx
set WORKAREASIZE  0x8000
set CLOCK_FREQ    8000
set DUAL_BANK     1
set DUAL_CORE     0

# Enable debug in low-power modes; stop watchdog on halt
set ENABLE_LOW_POWER  1
set STOP_WATCHDOG     1

# Connect under reset — essential for boards running code that blocks SWD
reset_config srst_only srst_nogate connect_assert_srst
set CONNECT_UNDER_RESET 1
set CORE_RESET          0

set AP_NUM   0
set GDB_PORT 3333

source [find target/stm32h7x.cfg]
